<html>
<head>
    <style>
      #orb_subsPH { position: static; overflow: auto; pointer-events:none; }
    </style>
    <script type="text/javascript" src="dash.all.min.js"></script>
    <script>
        let player;
        let video;
        let lastSource;
        function initialize() {
            video = document.getElementById("orb_video");
            player = orb_dashjs.MediaPlayer().create();
            player.initialize(video, undefined, true);
            player.attachTTMLRenderingDiv(document.getElementById('orb_subsPH'));

            player.on(orb_dashjs.MediaPlayer.events.PLAYBACK_PLAYING, function(e) {
                Android.onVideoEvent('DVBI_PLAYBACK_PLAYING', JSON.stringify(e));
            });

            player.on(orb_dashjs.MediaPlayer.events.PLAYBACK_ERROR, function(e) {
                Android.onVideoEvent('DVBI_PLAYBACK_ERROR', JSON.stringify(e));
            });

            player.on(orb_dashjs.MediaPlayer.events.PLAYBACK_STALLED, function(e) {
                Android.onVideoEvent('DVBI_PLAYBACK_STALLED', JSON.stringify(e));
            });

            player.on('urn:dvb:dash:appsignalling:2016', function (payload) {
                //payload.event.messageData = payload.event.messageData.replace(/hbbtv1.test\/_TESTSUITE\/TESTS/g, "192.168.1.179/hbbtv_tests");
                //payload.event.messageData = payload.event.messageData.replace(/.html5/g, ".html");
                console.log(payload);
                Android.onVideoEvent(payload.type, JSON.stringify(payload.event));
            });

            player.on('urn:dvb:iptv:cpm:2014', function (e) {
                e.event.messageData = e.event.messageData.replace("<BroadcastEvent>", "<BroadcastEvent xmlns:mpeg7='" + e.type + "'>");
                console.log(e);
                Android.onVideoEvent(e.type, JSON.stringify(e.event));
            });

            player.on('currentTrackChanged', (e) => {
                e.newMediaInfo.selected = true;
                if (e.oldMediaInfo) {
                    e.oldMediaInfo.selected = false;
                }
                Android.onVideoEvent('DVBI_TRACK_CHANGED', JSON.stringify(e.newMediaInfo));
            });

            function updateTracks() {
                function extractKindFromVideoTrack(track) {
                    if (track.roles) {
                        if (track.roles.length === 1) {
                            switch (track.roles[0]) {
                                case 'alternate':
                                    return 'alternative';
                                case 'main':
                                    return 'main';
                                case 'commentary':
                                    return 'commentary';
                                default:
                                    break;
                            }
                        }
                        if (track.roles.length === 2) {
                            if (track.roles.includes('subtitle') && track.roles.includes('main')) {
                                return 'subtitles';
                            }
                            if (track.roles.includes('caption') && track.roles.includes('main')) {
                                return 'captions';
                            }
                        }
                    }
                    return '';
                }
                function extractKindFromAudioTrack(track) {
                    if (track.roles) {
                        if (track.accessibility[0] == "1") {
                            switch (track.roles[0]) {
                                case 'alternate':
                                    return 'descriptions';
                                case 'commentary':
                                    return 'descriptions';
                                default:
                                    break;
                            }
                        }
                        if (track.roles.length === 1) {
                            switch (track.roles[0]) {
                                case 'alternate':
                                    return 'alternative';
                                case 'main':
                                    return 'main';
                                case 'commentary':
                                    return 'commentary';
                                default:
                                    break;
                            }
                        }
                        if (track.roles.length === 2) {
                            if (
                                track.roles.includes('description') &&
                                track.roles.includes('supplementary')
                            ) {
                                return 'descriptions';
                            }
                            if (track.roles.includes('description') && track.roles.includes('main')) {
                                return 'main-desc';
                            }
                            if (track.roles.includes('dub') && track.roles.includes('main')) {
                                return 'translation';
                            }
                        }
                    }
                    return '';
                }
                const curAudio = player.getCurrentTrackFor('audio');
                const curVideo = player.getCurrentTrackFor('video');
                const curText = player.getCurrentTrackFor('text');
                var tracks = {
                    audio: player.getTracksFor('audio').map(track => {
                        track.kind = extractKindFromAudioTrack(track);
                        track.selected = track === curAudio;
                        return track;
                    }),
                    video: player.getTracksFor('video').map(track => {
                        track.kind = extractKindFromVideoTrack(track);
                        track.selected = track === curVideo;
                        return track;
                    }),
                    text: player.getTracksFor('text').map(track => {
                        track.selected = track === curText;
                        return track;
                    })
                };
                console.log(tracks);
                Android.onVideoEvent('DVBI_TRACKS_UPDATED', JSON.stringify(tracks));
            }
            player.on('tracksChanged', updateTracks);
            player.on('streamInitialized', updateTracks);
        }
        function orb_loadMedia(url) {
            if (lastSource !== url) {
                lastSource = url;
                player.attachSource(url);
            }
            else {
                if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
                    Android.onVideoEvent('DVBI_PLAYBACK_PLAYING', JSON.stringify({}));
                }
            }
        }
        function orb_selectTrack(type, id) {
            var track = player
                .getTracksFor(type)
                .find((track) => track.id === id);
            if (track) {
                player.setCurrentTrack(track);
            }
        }
        function setVideoRectangle(x, y, width, height) {
            video.style.left = x + 'px';
            video.style.top = y + 'px';
            video.style.width = width + 'px';
            video.style.height = height + 'px';
        }
    </script>
</head>
<body onload="initialize()" style='margin:0;background-color:#000;'>
    <video id='orb_video' style="width:100%;height:100%;position:absolute;"></video>
    <div id='orb_subsPH'></div>
</body>
</html>
