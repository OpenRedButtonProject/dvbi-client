<html>
<head>
    <style>
        #orb_subsPH {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 2;
        }
        #orb_video {
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            z-index: 1;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
        }
    </style>
    <script type="text/javascript" src="dash.all.min.js"></script>
    <script>
        let _player;
        let _video;
        let _lastSource;
        let _subs;
        let _eventStreams = { }
        const _events = { };
        let _manifestEventStreamsReady = false;
        let _pendingEventPresenceChecks = [];
        let _playbackWatchdog = null;
        let _playingNotified = false;
        let _manifestRequested = false;
        let _subsEnabled = false;
        let _preferredSubLang = '';
        let _textAppliedOn = false;
        let _textAppliedId = null;
        let _applyingText = false;
        const PLAYER_EVENT_APP_SIGNALLING = "urn:dvb:dash:appsignalling:2016";
        const PLAYER_EVENT_EPG_METADATA = "urn:dvb:iptv:cpm:2014";
        const PLAYBACK_WATCHDOG_MS = 10000;

        function _notifyPlaying(reason) {
            if (_playingNotified) {
                return;
            }
            // Publish tracks before PLAYING so getComponentList can see active audio/video.
            try {
                updateTracks();
            } catch (e) {
                console.warn('updateTracks before PLAYING failed', e);
            }
            _playingNotified = true;
            if (_playbackWatchdog) {
                clearTimeout(_playbackWatchdog);
                _playbackWatchdog = null;
            }
            console.log("DVBI_PLAYBACK_PLAYING (" + reason + ")");
            Android.onVideoEvent('DVBI_PLAYBACK_PLAYING', JSON.stringify({ reason: reason }));
        }

        function _startPlaybackWatchdog() {
            if (_playbackWatchdog) {
                clearTimeout(_playbackWatchdog);
            }
            _playbackWatchdog = setTimeout(function() {
                // Stay silent until dash.js has requested the service-list
                // manifest URL (with any pre-play query already attached).
                if (!_playingNotified && _manifestRequested) {
                    console.warn("Playback watchdog: firing PLAYING fallback");
                    _notifyPlaying('watchdog');
                }
            }, PLAYBACK_WATCHDOG_MS);
        }

        function _reportMissingStreamEventIfNeeded(targetUrl, eventName) {
            if (eventName === "null") {
                return;
            }
            if (_eventStreams[targetUrl] && _eventStreams[targetUrl][eventName]) {
                return;
            }
            console.warn("Stream event with target url '" + targetUrl + "' and name '" + eventName + "' is not present in the manifest.");
            Android.onStreamEvent(targetUrl, eventName, JSON.stringify({ status: "error" }));
        }

        function _flushPendingEventPresenceChecks() {
            const pending = _pendingEventPresenceChecks;
            _pendingEventPresenceChecks = [];
            for (let i = 0; i < pending.length; i++) {
                _reportMissingStreamEventIfNeeded(pending[i].targetUrl, pending[i].eventName);
            }
        }

        function _onManifestLoaded(e) {
            console.log("manifest data:", e);
            _eventStreams = { };
            _manifestEventStreamsReady = false;
            function processEventStreams(eventStreams) {
                if (eventStreams) {
                    for (let eventStream of eventStreams) {
                        let scheme = eventStream.schemeIdUri;
                        if (!_eventStreams[scheme]) {
                            _eventStreams[scheme] = { };
                        }
                        _eventStreams[scheme][eventStream.value] = true;
                    }
                }
            }
            for (let period of e.data.Period_asArray) {
                processEventStreams(period.EventStream_asArray);
                for (let adaptation of period.AdaptationSet_asArray) {
                    processEventStreams(adaptation.InbandEventStream_asArray);
                }
            }
            console.log("event streams", _eventStreams);
            _manifestEventStreamsReady = true;
            _flushPendingEventPresenceChecks();
        }

        function _streamEventHandler(payload) {
            const event = payload.event;
            const eventData = {
                id: event.id,
                status: "trigger",
                timescale: event.eventStream.timescale,
                duration: event.duration,
                calculatedPresentationTime: event.calculatedPresentationTime,
                __orb_204data__: event.__orb_204data__,
            };
            console.log("Stream event payload:", payload);
            console.log("Stream event data:", eventData);
            Android.onStreamEvent(event.eventStream.schemeIdUri, event.eventStream.value, JSON.stringify(eventData));
        }

        function _primaryLang(code) {
            if (!code) {
                return '';
            }
            const t = String(code).toLowerCase().replace('_', '-').split('-')[0].trim();
            if (!t) {
                return '';
            }
            return _iso639_2_to_1[t] || t;
        }

        function _langMatches(trackLang, preferred) {
            if (!preferred) {
                return true;
            }
            const t = _primaryLang(trackLang);
            if (!t) {
                return false;
            }
            const parts = String(preferred).toLowerCase().replace(/\s+/g, '').split(',');
            for (let i = 0; i < parts.length; i++) {
                const p = _primaryLang(parts[i]);
                if (p && t === p) {
                    return true;
                }
            }
            return false;
        }

        function _applyTextPreference() {
            if (!_player || _applyingText) {
                return;
            }
            _applyingText = true;
            try {
                const tracks = _player.getTracksFor('text') || [];
                console.log("DASH_SUBS apply enabled=" + _subsEnabled +
                    " lang=" + _preferredSubLang + " tracks=" + tracks.length);
                if (!_subsEnabled) {
                    if (_textAppliedOn) {
                        if (typeof _player.enableText === 'function') {
                            _player.enableText(false);
                        }
                        if (typeof _player.setTextTrack === 'function') {
                            _player.setTextTrack(-1);
                        }
                    }
                    _setTrackEnabled('text', false);
                    _textAppliedOn = false;
                    _textAppliedId = null;
                    return;
                }
                _setTrackEnabled('text', true);
                if (typeof _player.enableText === 'function') {
                    _player.enableText(true);
                }
                let chosen = tracks.find(function(tr) {
                    return _langMatches(tr.lang, _preferredSubLang);
                });
                if (!chosen && tracks.length) {
                    chosen = tracks[0];
                }
                if (!chosen) {
                    return;
                }
                const already = _textAppliedOn && _textAppliedId === chosen.id;
                const cur = _player.getCurrentTrackFor('text');
                if (!already && cur !== chosen && typeof _player.setCurrentTrack === 'function') {
                    console.log("DASH_SUBS selecting text track id=" + chosen.id + " lang=" + chosen.lang);
                    _player.setCurrentTrack(chosen);
                }
                if (!already && typeof _player.setTextTrack === 'function') {
                    const idx = tracks.indexOf(chosen);
                    if (idx >= 0) {
                        _player.setTextTrack(idx);
                    }
                }
                _textAppliedOn = true;
                _textAppliedId = chosen.id;
            } finally {
                _applyingText = false;
            }
        }

        function _setTrackEnabled(type, enable) {
            let result = false;
            console.log("Setting track of type", type, "to enabled=" + enable);
            switch (type) {
                case "video":
                    result = enable === (_video.style.display === "none");
                    if (result) {
                        _video.style.display = enable ? "block" : "none";
                    }
                    break;
                case "audio":
                    result = enable === _video.muted;
                    if (result) {
                        _video.muted = !enable;
                    }
                    break;
                case "text":
                    if (_subs && !_subs.parentNode) {
                        document.body.appendChild(_subs);
                    }
                    if (_subs) {
                        const want = enable ? "visible" : "hidden";
                        result = _subs.style.visibility !== want;
                        _subs.style.visibility = want;
                    }
                    break;
                default:
                    break;
            }
            return result;
        }

        function _getTrackDataFromMediaInfo(mediaInfo, isSelected, currentRep) {
            function extractEncoding() {
                function isMPEG4HEAAC(codecString) {
                    if (codecString) {
                        const parts = codecString.split('.');
                        if (parts.length >= 3) {
                            const codecFamily = parts[0];
                            const mpeg4Audio = parts[1];
                            const objectType = parts[2].padStart(2 ,'0');
                            if (codecFamily === 'mp4a' && mpeg4Audio === '40') {
                                const heAacTypes = ['02', '05', '29']; // common HE-AAC object types for MPEG-4
                                return heAacTypes.includes(objectType);
                            }
                        }
                    }
                    return false;
                }
                function isEAC3(codecString) {
                    if (codecString) {
                        const eac3Identifiers = ['ec-3', 'dd+', 'ddp', 'e-ac-3']; // common identifiers for E-AC-3
                        const normalizedCodecString = codecString.toLowerCase();
                        return eac3Identifiers.includes(normalizedCodecString);
                    }
                    return false;
                }
                function isAVC(codecString) {
                    if(codecString) {
                        const parts = codecString.split('.');
                        if (parts[0].toLowerCase() === 'avc1') {
                            return true;
                        }
                    }
                    return false;
                }

                let trackEncoding = mediaInfo.codec ? mediaInfo.codec.split('"')[1] : undefined
                if (isMPEG4HEAAC(trackEncoding)) {
                    trackEncoding = "HEAAC";
                } else if (isEAC3(trackEncoding)) {
                    trackEncoding = "E-AC3";
                } else if(isAVC(trackEncoding) && currentRep) {
                    trackEncoding = "AVC_" + (parseInt(currentRep.width, 10) >= 720 ? "HD_" : "SD_") + currentRep.frameRate;
                }

                return trackEncoding ? trackEncoding : mediaInfo.mimeType;
            }

            let result = {
                type: mediaInfo.type,
                selected: isSelected,
                lang: mediaInfo.lang,
                id: mediaInfo.id,
                contentProtection: mediaInfo.contentProtection,
                encoding: extractEncoding()
            };
            function extractKindFromVideoTrack() {
                if (mediaInfo.roles) {
                    if (mediaInfo.roles.length === 1) {
                        switch (mediaInfo.roles[0]) {
                            case 'alternate':
                                return 'alternative';
                            case 'main':
                                return 'main';
                            case 'commentary':
                                return 'commentary';
                            default:
                                break;
                        }
                    }
                    if (mediaInfo.roles.length === 2) {
                        if (mediaInfo.roles.includes('subtitle') && mediaInfo.roles.includes('main')) {
                            return 'subtitles';
                        }
                        if (mediaInfo.roles.includes('caption') && mediaInfo.roles.includes('main')) {
                            return 'captions';
                        }
                    }
                }
                return '';
            }
            function extractKindFromAudioTrack() {
                if (mediaInfo.roles) {
                    if (mediaInfo.accessibility[0] == "1") {
                        switch (mediaInfo.roles[0]) {
                            case 'alternate':
                                return 'descriptions';
                            case 'commentary':
                                return 'descriptions';
                            default:
                                break;
                        }
                    }
                    if (mediaInfo.roles.length === 1) {
                        switch (mediaInfo.roles[0]) {
                            case 'alternate':
                                return 'alternative';
                            case 'main':
                                return 'main';
                            case 'commentary':
                                return 'commentary';
                            default:
                                break;
                        }
                    }
                    if (mediaInfo.roles.length === 2) {
                        if (
                            mediaInfo.roles.includes('description') &&
                            mediaInfo.roles.includes('supplementary')
                        ) {
                            return 'descriptions';
                        }
                        if (mediaInfo.roles.includes('description') && mediaInfo.roles.includes('main')) {
                            return 'main-desc';
                        }
                        if (mediaInfo.roles.includes('dub') && mediaInfo.roles.includes('main')) {
                            return 'translation';
                        }
                    }
                }
                return '';
            }
            function extractKindFromSubtitleTrack() {
                if (mediaInfo.accessibility[0] == "2") {
                    return "hearingImpaired";
                }
            }
            switch (mediaInfo.type) {
                case "video":
                    result.kind = extractKindFromVideoTrack();
                    if (mediaInfo.bitrateList[0]) {
                        result.aspectRatio = mediaInfo.bitrateList[0].width / mediaInfo.bitrateList[0].height;
                    }
                    break;
                case "audio":
                    result.kind = extractKindFromAudioTrack();
                    result.audioChannelConfiguration = mediaInfo.audioChannelConfiguration[0];
                    break;
                case "text":
                    result.kind = extractKindFromSubtitleTrack();
                    break;
                default:
                    return undefined;
            }
            return result;
        }
        function _initialize() {
            _subs = document.getElementById("orb_subsPH");
            _video = document.getElementById("orb_video");
            _video.style.transform = 'translateZ(0)';
            _video.style.webkitTransform = 'translateZ(0)';
            _player = orb_dashjs.MediaPlayer().create();
            _player.updateSettings({
                streaming: {
                    retryAttempts: 5,
                    retryIntervals: 500
                }
            });
            _player.initialize(_video, undefined, true);
            _player.attachTTMLRenderingDiv(_subs);

            _player.on('manifestLoaded', function(e) {
                _manifestRequested = true;
                _onManifestLoaded(e);
                _player.play();
            });

            _player.on(orb_dashjs.MediaPlayer.events.PLAYBACK_PLAYING, function(e) {
                _notifyPlaying('dash-playback-playing');
            });

            _video.addEventListener('playing', function() {
                _notifyPlaying('video-playing');
            });

            _video.addEventListener('canplay', function() {
                if (_video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
                    _notifyPlaying('video-canplay');
                }
            });

            _player.on(orb_dashjs.MediaPlayer.events.PLAYBACK_ERROR, function(e) {
                Android.onVideoEvent('DVBI_PLAYBACK_ERROR', JSON.stringify(e));
            });

            _player.on(orb_dashjs.MediaPlayer.events.PLAYBACK_STALLED, function(e) {
                Android.onVideoEvent('DVBI_PLAYBACK_STALLED', JSON.stringify(e));
            });

            _player.on(PLAYER_EVENT_APP_SIGNALLING, function (payload) {
                //payload.event.messageData = payload.event.messageData.replace(/hbbtv1.test\/_TESTSUITE\/TESTS/g, "192.168.1.179/hbbtv_tests");
                //payload.event.messageData = payload.event.messageData.replace(/.html5/g, ".html");
                console.log(payload);
                Android.onVideoEvent(payload.type, JSON.stringify(payload.event));
            });

            _player.on(PLAYER_EVENT_EPG_METADATA, function (e) {
                e.event.messageData = e.event.messageData.replace("<BroadcastEvent>", "<BroadcastEvent xmlns:mpeg7='" + e.type + "'>");
                console.log(e);
                Android.onVideoEvent(e.type, JSON.stringify(e.event));
            });

            _player.on('currentTrackChanged', (e) => {
                Android.onVideoEvent('DVBI_TRACK_CHANGED', JSON.stringify(_getTrackDataFromMediaInfo(e.newMediaInfo), true));
                updateTracks();
            });

            _player.on('streamInitialized', updateTracks);
            _player.on('periodSwitchCompleted', updateTracks);
        }

        function updateTracks(e) {
            if (!_player) {
                return;
            }
            const activeStream = _player.getActiveStream && _player.getActiveStream();
            if (!activeStream) {
                return;
            }
            const curAudio = _player.getCurrentTrackFor('audio');
            const curVideo = _player.getCurrentTrackFor('video');
            const curText = _player.getCurrentTrackFor('text');
            const streamInfo = activeStream.getStreamInfo();
            const dashAdapter = _player.getDashAdapter();
            const dashMetrics = _player.getDashMetrics();
            let currentVideoRep = null, currentAudioRep = null, currentTextRep = null;
            if (streamInfo) {
                const periodIdx = streamInfo.index;
                const videoAdaptation = dashAdapter.getAdaptationForType(periodIdx, 'video', streamInfo);
                const videoRepSwitch = dashMetrics.getCurrentRepresentationSwitch('video', true);
                if (videoAdaptation && videoRepSwitch) {
                    currentVideoRep = videoAdaptation.Representation_asArray.find(function (rep) {
                        return rep.id === videoRepSwitch.to
                    });
                }
                const audioAdaptation = dashAdapter.getAdaptationForType(periodIdx, 'audio', streamInfo);
                const audioRepSwitch = dashMetrics.getCurrentRepresentationSwitch('audio', true);
                if (audioAdaptation && audioRepSwitch) {
                    currentAudioRep = audioAdaptation.Representation_asArray.find(function (rep) {
                        return rep.id === audioRepSwitch.to
                    });
                }
                const textAdaptation = dashAdapter.getAdaptationForType(periodIdx, 'text', streamInfo);
                const textRepSwitch = dashMetrics.getCurrentRepresentationSwitch('text', true);
                if (textAdaptation && textRepSwitch) {
                    currentTextRep = textAdaptation.Representation_asArray.find(function (rep) {
                        return rep.id === textRepSwitch.to
                    });
                }
            }
            var tracks = {
                audio: _player.getTracksFor('audio').map(track => {
                    return _getTrackDataFromMediaInfo(track, track === curAudio, currentAudioRep);
                }).filter(track => track !== undefined),
                video: _player.getTracksFor('video').map(track => {
                    return _getTrackDataFromMediaInfo(track, track === curVideo, currentVideoRep);
                }).filter(track => track !== undefined),
                text: _player.getTracksFor('text').map(track => {
                    return _getTrackDataFromMediaInfo(track, track === curText, currentTextRep);
                }).filter(track => track !== undefined)
            };
            console.log("tracks:", tracks);
            Android.onVideoEvent('DVBI_TRACKS_UPDATED', JSON.stringify(tracks));
            _applyTextPreference();
        }
        function orb_loadMedia(url, enableSubs, lang) {
            _playingNotified = false;
            _manifestRequested = false;
            _lastSource = url;
            _subsEnabled = !!enableSubs;
            if (lang !== undefined && lang !== null) {
                _preferredSubLang = lang;
            }
            _textAppliedOn = false;
            _textAppliedId = null;
            for (const e in _events) {
                _events[e] = 0;
                _player.off(e, _streamEventHandler);
            }
            // Presence checks queued against the previous MPD must not be
            // flushed when this source's manifestLoaded runs.
            _manifestEventStreamsReady = false;
            _pendingEventPresenceChecks = [];
            _eventStreams = {};
            // Always GET the service-list manifest URL. Replaying a cached
            // source skips the request and the pre-play query never reaches
            // the origin.
            _player.attachSource(null);
            _player.attachSource(url);
            _player.play();
            _startPlaybackWatchdog();
            _setTrackEnabled("video", true);
            _setTrackEnabled("audio", true);
            _applyTextPreference();
        }

        function orb_setSubtitles(enabled, lang) {
            _subsEnabled = !!enabled;
            if (lang !== undefined && lang !== null) {
                _preferredSubLang = lang;
            }
            console.log("DASH_SUBS orb_setSubtitles enabled=" + _subsEnabled + " lang=" + _preferredSubLang);
            _applyTextPreference();
        }

        function orb_selectTrack(type, id) {
            if (type === 'text') {
                if (id !== undefined && id !== null) {
                    _subsEnabled = true;
                } else {
                    _subsEnabled = false;
                }
            }
            if (id !== undefined && id !== null) {
                var track = _player
                    .getTracksFor(type)
                    .find((track) => track.id == id);
                if (track) {
                    if (track !== _player.getCurrentTrackFor(type)) {
                        console.log("Selecting track of type", type, "and lang", track.lang);
                        _player.setCurrentTrack(track);
                    }
                    if (type === 'text' && typeof _player.enableText === 'function') {
                        _player.enableText(true);
                    }
                    if (type === 'text' && typeof _player.setTextTrack === 'function') {
                        var tracks = _player.getTracksFor('text') || [];
                        var idx = tracks.indexOf(track);
                        if (idx >= 0) {
                            _player.setTextTrack(idx);
                        }
                    }
                    if (_setTrackEnabled(type, true)) {
                        Android.onVideoEvent('DVBI_TRACK_CHANGED', JSON.stringify(_getTrackDataFromMediaInfo(track, true)));
                    }
                } else if (type === 'text') {
                    _applyTextPreference();
                }
            }
            else {
                if (type === 'text' && typeof _player.enableText === 'function') {
                    _player.enableText(false);
                }
                if (type === 'text' && typeof _player.setTextTrack === 'function') {
                    _player.setTextTrack(-1);
                }
                if (_setTrackEnabled(type, false)) {
                    Android.onVideoEvent('DVBI_TRACK_CHANGED', JSON.stringify({type:type}));
                }
            }
        }

        function orb_addStreamEventListener(targetUrl, eventName) {
            if (targetUrl !== PLAYER_EVENT_EPG_METADATA) {
                if (!_events[targetUrl]) {
                    _events[targetUrl] = 1;
                    _player.on(targetUrl, _streamEventHandler);
                }
                else {
                    _events[targetUrl]++;
                }
                if (eventName !== "null") {
                    if (!_manifestEventStreamsReady) {
                        _pendingEventPresenceChecks.push({ targetUrl: targetUrl, eventName: eventName });
                    } else {
                        _reportMissingStreamEventIfNeeded(targetUrl, eventName);
                    }
                }
                console.log("Added event listener for event " + targetUrl);
            }
        }

        function orb_removeStreamEventListener(targetUrl) {
            if (_events[targetUrl]) {
                _events[targetUrl]--;
                if (_events[targetUrl] <= 0) {
                    _player.off(targetUrl, _streamEventHandler);
                }
                console.log("Removed event listener for event " + targetUrl);
            }
        }

        function orb_setVideoRectangle(x, y, width, height) {
            _video.style.left = x + 'px';
            _video.style.top = y + 'px';
            _video.style.width = width + 'px';
            _video.style.height = height + 'px';
            if (_subs) {
                _subs.style.left = x + 'px';
                _subs.style.top = y + 'px';
                _subs.style.width = width + 'px';
                _subs.style.height = height + 'px';
            }
        }
    </script>
</head>
<!-- Hold fill is black so an empty overlay is not DTVKit green. -->
<body onload="_initialize()" style='margin:0;background-color:#000;'>
    <video id='orb_video' style="display:block;"></video>
    <div id='orb_subsPH'></div>
</body>
